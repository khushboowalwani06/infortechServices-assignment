<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Menu</title>

    <link rel="stylesheet" href="sideMenu.css">

    <script>
        function closeMenu() {
            document.getElementById("sideMenu").classList.remove("active");
        }
    </script>
</head>

<body>

    <div class="Menu" id="sideMenu">

        <div class="header">
            <img src="images_icons/Logo.png" alt="Logo">

            <img class="cross" src="cross.png" onclick="closeMenu()">
        </div>

        <div class="menu-item">
            <img src="images_icons/Home.png">
            <p>Home</p>
        </div>

        <div class="menu-item">
            <img src="images_icons/AboutUs.png">
            <p>About Us</p>
        </div>

        <div class="menu-item">
            <img src="images_icons/OurServices.png">
            <p>Our Services</p>
        </div>

        <div class="menu-item">
            <img src="images_icons/Pricing.png">
            <p>Pricing</p>
        </div>

        <div class="menu-item">
            <img src="images_icons/FAQ.png">
            <p>FAQ</p>
        </div>

        <div class="menu-item">
            <img src="images_icons/Contact.png">
            <p>Contact</p>
        </div>

        <button class="button">
            <img class="hover-icon" src="images_icons/Contact-icon.png">
            Contact Us
        </button>

    </div>

</body>
</html>
